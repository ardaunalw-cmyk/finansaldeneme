version: '3.8'

services:
  # ============================================================================
  # PostgreSQL 16 - Relational Financial Ledger Database
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: utl_finans_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-utl_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-UtlFinansSecure2026!}
      POSTGRES_DB: ${POSTGRES_DB:-utl_finans_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-utl_admin} -d ${POSTGRES_DB:-utl_finans_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: >
      postgres -c max_connections=200
               -c shared_buffers=512MB
               -c effective_cache_size=1536MB
               -c maintenance_work_mem=128MB
               -c checkpoint_completion_target=0.9
               -c wal_buffers=16MB
               -c default_statistics_target=100
               -c random_page_cost=1.1

  # ============================================================================
  # Redis 7 - Market Ticks, Hot Caching & Pub/Sub
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: utl_finans_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # FastAPI Application - Core FinTech Engine
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: utl_finans_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-utl_admin}:${POSTGRES_PASSWORD:-UtlFinansSecure2026!}@db:5432/${POSTGRES_DB:-utl_finans_db}
      - SYNC_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-utl_admin}:${POSTGRES_PASSWORD:-UtlFinansSecure2026!}@db:5432/${POSTGRES_DB:-utl_finans_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=utl_super_secret_sovereign_intelligence_2026_key
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic

volumes:
  postgres_data:
  redis_data:
