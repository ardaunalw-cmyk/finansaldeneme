<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722" />
      <stop offset="100%" stop-color="#08090E" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F01E17" />
      <stop offset="55%" stop-color="#E3120B" />
      <stop offset="100%" stop-color="#A80903" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E3120B" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#232738" stroke-width="3"/>
  <!-- The Economist Style Red Hallmark Box -->
  <rect x="24" y="24" width="144" height="144" rx="22" fill="url(#redGrad)" filter="url(#glow)" />
  <!-- Crisp White Serif Onc&Al Analyst Typography -->
  <text x="96" y="88" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="-1">Onc&amp;Al</text>
  <text x="96" y="126" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="26" fill="rgba(255,255,255,0.95)" letter-spacing="-0.5">Analyst</text>
</svg>
