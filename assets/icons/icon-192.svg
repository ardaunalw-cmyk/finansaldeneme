<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111A2E" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C86FF" />
      <stop offset="55%" stop-color="#2F6BFF" />
      <stop offset="100%" stop-color="#1A3FB0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2F6BFF" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#1A2540" stroke-width="3"/>
  <!-- Cobalt brand mark -->
  <rect x="24" y="24" width="144" height="144" rx="22" fill="url(#brandGrad)" filter="url(#glow)" />
  <!-- White Onc&Al Analyst Typography -->
  <text x="96" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="-1">Onc&amp;Al</text>
  <text x="96" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" fill="rgba(255,255,255,0.95)" letter-spacing="-0.5">Analyst</text>
</svg>
