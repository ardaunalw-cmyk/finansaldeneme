# Runs on every push and pull request: syntax check, unit tests and the production build.
# Vercel deploys main on its own; a red run here means the deployed site may be broken.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: for f in assets/js/*.js api/*.mjs scripts/*.mjs build.mjs dev.mjs; do node --check "$f" || exit 1; done
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
