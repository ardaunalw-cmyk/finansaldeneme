# ==============================================================================
# UTL FİNANS - Production Nginx Reverse Proxy & Static Asset Gateway
# ==============================================================================
# Role: Senior FinTech Systems Architect & DevOps Engineer
# Standards: OWASP Secure Configuration, High-Concurrency WebSockets, SSL/TLS Hardening
#
# ARCHITECTURAL BOTTLENECK ANALYSIS:
# ------------------------------------------------------------------------------
# 1. BOTTLENECK: WebSocket Premature Termination (Proxy Read Timeout)
#    - Risk: Standard Nginx proxy_read_timeout defaults to 60 seconds. In market
#      streaming where heartbeats or ticks may occasionally pause between market
#      sessions, clients suffer mass disconnection storms every 60s.
#    - Mitigation: proxy_read_timeout set to 3600s with HTTP/1.1 Upgrade headers.
#
# 2. BOTTLENECK: Worker Connection Exhaustion under Heavy Ticker Polling
#    - Risk: Default worker_connections (512-1024) quickly fills up when thousands
#      of client browser tabs hold persistent WebSocket connections simultaneously.
#    - Mitigation: worker_connections raised to 4096; multi_accept and epoll enabled.
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # OWASP: Hide Nginx Version

    # Gzip Compression for Fast Static Asset Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate Limiting Zones (Protects Auth & Calculations from Denial-of-Service)
    limit_req_zone $binary_remote_addr zone=auth_rate_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_general_limit:20m rate=50r/s;

    # Upstream Backend Pool (FastAPI ASGI Workers)
    upstream utl_backend_cluster {
        server backend:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Map for WebSocket Upgrade Handshake
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name localhost;

        # OWASP Recommended Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com ws: wss: data:;" always;

        # Root directory for static frontend files
        root /usr/share/nginx/html;
        index index.html;

        # ----------------------------------------------------------------------
        # 1. Static Web Frontend Routing
        # ----------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # Long-lived cache for assets
        location /assets/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # ----------------------------------------------------------------------
        # 2. WebSocket Real-Time Market Streaming Route
        # ----------------------------------------------------------------------
        location /api/v1/market/ws {
            proxy_pass http://utl_backend_cluster/api/v1/market/ws;
            proxy_http_version 1.1;
            
            # WebSocket Upgrade Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Extended timeouts to prevent dropped market feeds
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;

            # Client headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # 3. Authentication Route (Strict Rate Limiting Applied)
        # ----------------------------------------------------------------------
        location /api/v1/auth/ {
            limit_req zone=auth_rate_limit burst=20 nodelay;

            proxy_pass http://utl_backend_cluster/api/v1/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # 4. Core RESTful Financial API Proxy
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_general_limit burst=100 nodelay;

            proxy_pass http://utl_backend_cluster/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffer tuning for large balance sheet payloads
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Health check endpoint passthrough
        location /health {
            proxy_pass http://utl_backend_cluster/health;
            access_log off;
        }

        # API Docs passthrough
        location /docs {
            proxy_pass http://utl_backend_cluster/docs;
        }
        location /openapi.json {
            proxy_pass http://utl_backend_cluster/openapi.json;
        }
    }
}

