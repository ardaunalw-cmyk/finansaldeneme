# ==============================================================================
# UTL FİNANS - Sovereign FinTech Enterprise Orchestration
# ==============================================================================
# Role: Senior FinTech Systems Architect & DevOps Lead
# Architecture: High-Availability, Containerized Financial Micro-Stack
#
# ARCHITECTURAL BOTTLENECK ANALYSIS:
# ------------------------------------------------------------------------------
# 1. BOTTLENECK: Database Connection Saturation under ASGI Worker Concurrency
#    - Risk: With 4 Uvicorn workers per backend replica, each holding a pool of 25-40
#      connections, scaling to multiple containers easily exhausts PostgreSQL's
#      `max_connections=200`, causing "FATAL: remaining connection slots are reserved".
#    - Mitigation: PostgreSQL `max_connections` is tuned to 300, and async session
#      checkout uses strict context managers that commit and return connections
#      immediately after queries.
#
# 2. BOTTLENECK: Redis Persistence Disk I/O Saturation
#    - Risk: In high-frequency market streaming (BIST, FX, Commodities), every price
#      tick can trigger cache writes. If Redis persistence is set to `appendfsync always`,
#      disk I/O bottlenecks cause latency spikes in the entire pipeline.
#    - Mitigation: Redis configured with `appendfsync everysec`, `maxmemory 512mb`,
#      and `maxmemory-policy allkeys-lru` to guarantee sub-millisecond writes.
#
# 3. BOTTLENECK: Operating System Epoll File Descriptor Exhaustion
#    - Risk: Thousands of simultaneous browser clients opening persistent WebSockets
#      to `/api/v1/market/ws` hit the default Linux 1024 open file descriptor limit.
#    - Mitigation: Nginx configured with `worker_rlimit_nofile 65535` and Docker ulimits
#      configured for nofile: 65535.
# ==============================================================================

version: '3.9'

services:
  # ============================================================================
  # 1. PostgreSQL 16 - High-Precision Financial Ledger Database
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: utl_finans_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-utl_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-UtlFinansSecure2026!}
      POSTGRES_DB: ${POSTGRES_DB:-utl_finans_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-utl_admin} -d ${POSTGRES_DB:-utl_finans_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: >
      postgres -c max_connections=300
               -c shared_buffers=512MB
               -c effective_cache_size=1536MB
               -c maintenance_work_mem=128MB
               -c checkpoint_completion_target=0.9
               -c wal_buffers=16MB
               -c default_statistics_target=100
               -c random_page_cost=1.1
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    networks:
      - utl_fintech_net

  # ============================================================================
  # 2. Redis 7 - Distributed Cache, Session Blacklist & Ticker Pub/Sub
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: utl_finans_redis
    restart: always
    command: >
      redis-server --appendonly yes
                   --appendfsync everysec
                   --maxmemory 512mb
                   --maxmemory-policy allkeys-lru
                   --tcp-backlog 511
                   --timeout 300
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - utl_fintech_net

  # ============================================================================
  # 3. FastAPI Backend - Core Financial & Quantitative Engine
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: utl_finans_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-utl_admin}:${POSTGRES_PASSWORD:-UtlFinansSecure2026!}@db:5432/${POSTGRES_DB:-utl_finans_db}
      - SYNC_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-utl_admin}:${POSTGRES_PASSWORD:-UtlFinansSecure2026!}@db:5432/${POSTGRES_DB:-utl_finans_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-utl_super_secret_sovereign_intelligence_2026_key}
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
    expose:
      - "8000"
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - utl_fintech_net

  # ============================================================================
  # 4. Frontend & Reverse Proxy (Nginx) - Static Files & WebSocket Gateway
  # ============================================================================
  frontend:
    image: nginx:1.27-alpine
    container_name: utl_finans_gateway
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - utl_fintech_net

volumes:
  postgres_data:
    name: utl_postgres_data
  redis_data:
    name: utl_redis_data
  backend_logs:
    name: utl_backend_logs

networks:
  utl_fintech_net:
    name: utl_fintech_network
    driver: bridge

